@if (utilisateurs$ | async; as utilisateurs) {
    @for (u of utilisateurs; track u.id) {
        <app-utilisateur-card [utilisateur]="u"
        (suppression)="onSuppression($event)"/>
    }
} @else {
    <p>Aucun utilisateur</p>
}
